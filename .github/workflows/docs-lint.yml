name: docs-lint

on:
  push:
    paths:
      - "**.md"
      - "tools/**"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "**.md"
      - "tools/**"
      - ".github/workflows/docs-lint.yml"

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/docs-lint.mjs
