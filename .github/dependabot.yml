version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    # TypeScript 7 は typescript-eslint 未対応で Lint (Frontend) が落ち、group 全体が止まる（docs/dependency-debt.md 参照）。
    # markdown-it 15 は linkify の fuzzy link 既定 off でユーザー投稿記事の表示が無言で変わりうる（同上）。
    # 解除条件: typescript-eslint が TS 7.0 系対応したら / Markdown 描画テスト追加後に、それぞれ ignore を外す。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "markdown-it"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer:
        patterns:
          - "*"
    # Laravel 13 は prod の PHP 8.3 制約で上げられない（docs/dependency-debt.md 参照）。
    # 解除条件: prod を PHP 8.4+ へ。揃ったらこの ignore を外して移行する。
    ignore:
      - dependency-name: "laravel/framework"
        update-types: ["version-update:semver-major"]
