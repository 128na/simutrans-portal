name: "Setup php"
description: "Setup php"
inputs:
  php-version:
    description: "PHPバージョン"
    required: false
    default: "8.3"
  composer-options:
    description: "composer install に渡す追加オプション"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - uses: "ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6" # v4
      with:
        composer-options: ${{ inputs.composer-options }}
