name: Auto Package Update

on:
  schedule:
    - cron: "0 0 * * 0"  # 毎週日曜日
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # composer と npm は外部のコードを実行するので、このジョブには書き込みできる認証情報を置かない
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: php -r "copy('.env.ci', '.env');"
      - uses: ./.github/actions/php
      - uses: ./.github/actions/nodejs

      - name: Update PHP dependencies
        run: |
          composer update
          composer bump
          composer update

      - name: Update Node.js dependencies
        run: npm update

      - name: Export diff
        id: diff
        run: |
          git status --short
          git diff --binary -- composer.json composer.lock package.json package-lock.json > "$RUNNER_TEMP/update.patch"
          if [ -s "$RUNNER_TEMP/update.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          retention-days: 1

  # 差分を当てて push するだけ。外部のコードは実行しない
  push:
    name: Commit and Push
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN の push では CI が動かないので App のトークンを使う
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}

      - name: Commit and push
        run: |
          git apply --index \
            --include=composer.json --include=composer.lock \
            --include=package.json --include=package-lock.json \
            "$RUNNER_TEMP/update.patch"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "chore: auto update dependencies"
          git push
